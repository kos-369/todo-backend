# Local development only.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set it in .env}
      MYSQL_DATABASE: todo
      MYSQL_USER: todo
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set it in .env}
    ports:
      # Bind to localhost so the DB isn't reachable from other machines.
      - "127.0.0.1:3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # Use TCP: the socket answers during init, before the real server starts.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db-data:
